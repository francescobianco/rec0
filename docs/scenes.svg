<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Cantarell, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f4a"/>
      <stop offset="1" stop-color="#1b1d2e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c9a5"/>
      <stop offset="1" stop-color="#d9a27c"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="60" width="480" height="270" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="680" y="60" width="480" height="270" rx="10"/></clipPath>
    <clipPath id="bubble"><circle cx="1098" cy="276" r="38"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f96b8"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="18" fill="#12131c"/>

  <!-- Close-up -->
  <text x="40" y="40" fill="#e6e8f2" font-size="22" font-weight="700">Close-up</text>
  <text x="520" y="40" fill="#8f96b8" font-size="15" text-anchor="end">rec0 or an unlisted window has focus</text>
  <g clip-path="url(#c1)">
    <rect x="40" y="60" width="480" height="270" fill="#3a4258"/>
    <rect x="40" y="60" width="480" height="270" fill="#6f7f99" opacity="0.35"/>
    <rect x="360" y="90" width="110" height="80" rx="3" fill="#202638" stroke="#c9ced8" stroke-width="4"/>
    <path d="M120 330 C120 250 200 225 280 225 C360 225 440 250 440 330 Z" fill="#2c3550"/>
    <rect x="262" y="200" width="36" height="34" fill="#d9a27c"/>
    <path d="M222 168 C214 96 346 96 338 168 C334 140 226 140 222 168 Z" fill="#6b6f78"/>
    <ellipse cx="280" cy="166" rx="52" ry="60" fill="url(#skin)"/>
    <path d="M226 152 C218 78 342 78 334 152 C324 126 236 126 226 152 Z" fill="#6b6f78"/>
    <rect x="244" y="150" width="30" height="18" rx="5" fill="none" stroke="#1b1d2e" stroke-width="4"/>
    <rect x="286" y="150" width="30" height="18" rx="5" fill="none" stroke="#1b1d2e" stroke-width="4"/>
    <path d="M232 192 C250 236 310 236 328 192 C318 222 242 222 232 192 Z" fill="#b9b9b9"/>
  </g>
  <rect x="40" y="60" width="480" height="270" rx="10" fill="none" stroke="#3d4260" stroke-width="2"/>

  <!-- arrow -->
  <path d="M548 180 L652 180" stroke="#8f96b8" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="600" y="164" fill="#8f96b8" font-size="14" text-anchor="middle">focus</text>
  <text x="600" y="206" fill="#8f96b8" font-size="14" text-anchor="middle">0.3 s</text>

  <!-- Share -->
  <text x="680" y="40" fill="#e6e8f2" font-size="22" font-weight="700">Share</text>
  <text x="1160" y="40" fill="#8f96b8" font-size="15" text-anchor="end">a window listed in the project has focus</text>
  <g clip-path="url(#c2)">
    <rect x="680" y="60" width="480" height="270" fill="url(#desk)"/>
    <!-- the shared window, in an accent frame, at its real position -->
    <rect x="726" y="88" width="330" height="214" rx="10" fill="none" stroke="#e95420" stroke-width="5"/>
    <rect x="728.5" y="90.5" width="325" height="209" rx="8" fill="#f6f5f4"/>
    <rect x="728.5" y="90.5" width="325" height="26" rx="8" fill="#dedddb"/>
    <rect x="728.5" y="106" width="325" height="10" fill="#dedddb"/>
    <circle cx="744" cy="103.5" r="4.5" fill="#e95420"/>
    <rect x="760" y="97" width="120" height="13" rx="6.5" fill="#f6f5f4"/>
    <rect x="746" y="130" width="160" height="12" rx="3" fill="#3584e4"/>
    <rect x="746" y="152" width="290" height="7" rx="3" fill="#c0bfbc"/>
    <rect x="746" y="166" width="270" height="7" rx="3" fill="#c0bfbc"/>
    <rect x="746" y="180" width="282" height="7" rx="3" fill="#c0bfbc"/>
    <rect x="746" y="200" width="290" height="70" rx="5" fill="#241f31"/>
    <rect x="758" y="212" width="90" height="7" rx="3" fill="#8ff0a4"/>
    <rect x="758" y="226" width="150" height="7" rx="3" fill="#99c1f1"/>
    <rect x="770" y="240" width="120" height="7" rx="3" fill="#f9f06b"/>
    <rect x="758" y="254" width="70" height="7" rx="3" fill="#99c1f1"/>
    <!-- webcam bubble -->
    <g clip-path="url(#bubble)">
      <rect x="1056" y="234" width="84" height="84" fill="#3a4258"/>
      <path d="M1068 318 C1068 296 1084 290 1098 290 C1112 290 1128 296 1128 318 Z" fill="#2c3550"/>
      <ellipse cx="1098" cy="270" rx="15" ry="18" fill="url(#skin)"/>
      <path d="M1083 266 C1080 243 1116 243 1113 266 C1108 257 1088 257 1083 266 Z" fill="#6b6f78"/>
    </g>
    <circle cx="1098" cy="276" r="38" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <rect x="680" y="60" width="480" height="270" rx="10" fill="none" stroke="#3d4260" stroke-width="2"/>

  <!-- captions -->
  <text x="40" y="368" fill="#c3c7d9" font-size="15">The webcam, full frame. Windows you did not list never appear.</text>
  <text x="680" y="368" fill="#c3c7d9" font-size="15">The window where it really is on screen, framed in your accent</text>
  <text x="680" y="390" fill="#c3c7d9" font-size="15">colour, with the webcam in a bubble that follows the one on screen.</text>
  <text x="40" y="420" fill="#8f96b8" font-size="13">Illustration</text>
</svg>
