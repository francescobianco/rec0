<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="frame" x1="0" y1="12" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="18" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3dbf8"/>
      <stop offset="1" stop-color="#62a0ea"/>
    </linearGradient>
    <linearGradient id="hill-back" x1="0" y1="56" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="hill-front" x1="0" y1="66" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="cam-shell" x1="0" y1="52" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="cam-bezel" x1="0" y1="59" x2="0" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241f31"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <radialGradient id="cam-glass" cx="82" cy="76" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="0.4" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </radialGradient>
    <clipPath id="screen-clip">
      <rect x="14" y="18" width="92" height="68" rx="5"/>
    </clipPath>
  </defs>

  <!-- screen: base thickness, frame -->
  <rect x="8" y="16" width="104" height="82" rx="11" fill="#9a9996"/>
  <rect x="8" y="12" width="104" height="80" rx="11" fill="url(#frame)"/>

  <!-- virtual desktop -->
  <g clip-path="url(#screen-clip)">
    <rect x="14" y="18" width="92" height="68" fill="url(#sky)"/>
    <path d="M14 66 C30 56 44 56 60 64 C76 71 94 68 106 60 V86 H14 Z" fill="url(#hill-back)"/>
    <path d="M14 78 C32 69 50 70 70 78 C84 83 96 82 106 77 V86 H14 Z" fill="url(#hill-front)"/>
  </g>

  <!-- shared window -->
  <rect x="22" y="27" width="46" height="32" rx="4" fill="#1a5fb4" opacity="0.2"/>
  <rect x="22" y="25" width="46" height="32" rx="4" fill="#ffffff"/>
  <path d="M26 25 H64 A4 4 0 0 1 68 29 V32 H22 V29 A4 4 0 0 1 26 25 Z" fill="#deddda"/>
  <rect x="28" y="38" width="22" height="4" rx="2" fill="#c0bfbc"/>
  <rect x="28" y="46" width="30" height="4" rx="2" fill="#deddda"/>

  <!-- record indicator -->
  <circle cx="96" cy="30" r="9" fill="#ffffff" opacity="0.85"/>
  <circle cx="96" cy="30" r="6.5" fill="#e01b24"/>
  <circle cx="94" cy="28" r="2" fill="#f66151"/>

  <!-- webcam bubble -->
  <circle cx="88" cy="87" r="31" fill="#000000" opacity="0.15"/>
  <circle cx="88" cy="86" r="30" fill="#241f31"/>
  <circle cx="88" cy="82" r="30" fill="url(#cam-shell)"/>
  <circle cx="88" cy="83" r="23" fill="#77767b"/>
  <circle cx="88" cy="82" r="23" fill="url(#cam-bezel)"/>
  <circle cx="88" cy="82" r="18" fill="url(#cam-glass)"/>
  <circle cx="88" cy="82" r="11" fill="#1a5fb4"/>
  <circle cx="88" cy="82" r="7" fill="#241f31"/>
  <path d="M75 79 A13.5 13.5 0 0 1 85 68.5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <circle cx="96" cy="90" r="2.5" fill="#ffffff" opacity="0.5"/>
</svg>
