<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="14" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="1" stop-color="#62a0ea"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="70" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="62" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="8" y="14" width="112" height="92" rx="12"/>
    </clipPath>
    <clipPath id="cam">
      <circle cx="90" cy="84" r="20"/>
    </clipPath>
  </defs>
  <!-- base -->
  <rect x="8" y="18" width="112" height="96" rx="12" fill="#1a5fb4"/>
  <!-- virtual desktop -->
  <g clip-path="url(#card)">
    <rect x="8" y="14" width="112" height="92" fill="url(#sky)"/>
    <path d="M8 84 C32 70 52 72 72 82 C90 91 106 86 120 78 V106 H8 Z" fill="#99c1f1" opacity="0.6"/>
    <path d="M8 96 C30 86 54 88 76 96 C94 102 108 98 120 92 V106 H8 Z" fill="url(#hill)"/>
    <rect x="8" y="14" width="112" height="1.5" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- window -->
  <rect x="20" y="28" width="66" height="48" rx="5" fill="#000000" opacity="0.15" transform="translate(0 2)"/>
  <rect x="20" y="28" width="66" height="48" rx="5" fill="#ffffff"/>
  <path d="M25 28 H81 A5 5 0 0 1 86 33 V38 H20 V33 A5 5 0 0 1 25 28 Z" fill="#deddda"/>
  <circle cx="79" cy="33" r="2.2" fill="#9a9996"/>
  <rect x="27" y="45" width="34" height="4" rx="2" fill="#c0bfbc"/>
  <rect x="27" y="53" width="44" height="4" rx="2" fill="#deddda"/>
  <rect x="27" y="61" width="26" height="4" rx="2" fill="#deddda"/>
  <!-- webcam bubble -->
  <circle cx="90" cy="86" r="24" fill="#000000" opacity="0.18"/>
  <circle cx="90" cy="84" r="24" fill="#ffffff"/>
  <g clip-path="url(#cam)">
    <rect x="68" y="62" width="44" height="44" fill="url(#face)"/>
    <circle cx="90" cy="79" r="7.5" fill="#f6d32d"/>
    <path d="M74 106 C74 95 80 89.5 90 89.5 C100 89.5 106 95 106 106 Z" fill="#f6d32d"/>
  </g>
  <!-- record dot -->
  <circle cx="107.5" cy="64.5" r="9.5" fill="#ffffff"/>
  <circle cx="107.5" cy="64.5" r="7" fill="#e01b24"/>
